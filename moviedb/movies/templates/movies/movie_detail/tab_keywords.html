<!-- movies/templates/movies/movie_detail/tab_keywords.html -->

{% load movie_tags %}

<div class="row">
    <div class="col-12">
        {% if Movie.keyword_ids %}
            <div class="d-flex flex-wrap gap-2">
                {% for keyword in Movie.keywords.all|dictsort:"name" %}
                    <span class="badge bg-secondary px-3 py-2">
                        {{ keyword.name }}
                        <small class="ms-2">
                            <i class="bi bi-film me-1"></i>
                            {{ keyword.movies_count }}
                        </small>
                    </span>
                {% endfor %}
            </div>
        {% else %}
            <div class="Movie-detail-card card border-0">
                <div class="text-center py-5">
                    <div class="mb-3">
                        <i class="bi bi-tags text-muted" style="font-size: 3rem;"></i>
                    </div>
                    <h5 class="text-muted mb-2">No Keywords Available</h5>
                    <p class="text-muted mb-0">
                        Keywords for this Movie haven't been loaded yet.
                    </p>
                </div>
            </div>
        {% endif %}
    </div>
</div>
