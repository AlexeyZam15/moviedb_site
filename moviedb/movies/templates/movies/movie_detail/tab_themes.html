<!-- movies/templates/movies/movie_detail/tab_themes.html -->

{% load movie_tags %}

<div class="row">
    <div class="col-12">
        {% if Movie.themes.exists %}
            <div class="d-flex flex-wrap gap-2">
                {% for theme in Movie.themes.all|dictsort:"name" %}
                    <span class="badge bg-info text-dark px-3 py-2">
                        {{ theme.name }}
                        {% if theme.movies_count %}
                            <small class="ms-2">
                                <i class="bi bi-film me-1"></i>
                                {{ theme.movies_count }}
                            </small>
                        {% endif %}
                    </span>
                {% endfor %}
            </div>
        {% else %}
            <div class="Movie-detail-card card border-0">
                <div class="text-center py-5">
                    <div class="mb-3">
                        <i class="bi bi-palette text-muted" style="font-size: 3rem;"></i>
                    </div>
                    <h5 class="text-muted mb-2">No Themes Available</h5>
                    <p class="text-muted mb-0">
                        Themes for this Movie haven't been loaded yet.
                    </p>
                </div>
            </div>
        {% endif %}
    </div>
</div>
